services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: ./PM-API/Dockerfile
    ports:
      - "5229:5229"
    depends_on:
      - vault
    networks:
      - my-network
  
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/data:/vault/data
      - ./vault:/vault/config
    command: [ "server" ]
    networks:
      - my-network
  
  frontend:
    container_name: frontend
    build:
      context: ./PasswordManager
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8000:80"
    networks:
      - my-network
        
        
networks:
  my-network:
    driver: bridge