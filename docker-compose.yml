services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: ./PM-API/Dockerfile
    ports:
      - "5229:5229"
    depends_on:
      - vault
      
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports: 
    - "8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/data:/vault/data
      - ./vault:/vault/config
    command: ["server"]